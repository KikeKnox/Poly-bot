# ── RlPredictor strategy (ONLINE RUNTIME, paper-only) ─────────────────────────
# Online vehicle of the design contract in `docs/rl_predictor_design/`.
# Linear softmax policy over 9 actions, loaded fail-closed from a
# `paper_approved` artifact (`policy.json` + `manifest.json`) with an online
# REINFORCE learner inside the bot (bounded worker, immutable snapshots via
# watch, versioned checkpoints). Consumes `ModelPrediction` from the frozen
# predictor as the `p_yes` feature — the predictor artifact
# (`src/tools/model/artifacts/btc5m`) is NOT a policy and is never pointed to
# here as one.
#
# Live barrier: `paper_only=true` is fixed, and the
# `RlPredictor::new` constructor aborts with `Mode::Live` — neither trading nor
# learning in live, whatever this config says (a structural barrier, not a default).
#
# State: a REAL `paper_approved` artifact is present in `artifact_dir` (below) —
# `paper_bootstrap_v1`, promoted from a verified tip of an online training run
# (see the artifact's `approval_report.json`).
# Dedicated startup profile: `launch_rl_paper.sh` (disables the rest of the
# strategies/tools via env without touching their TOMLs). If the artifact is
# missing or does not validate, the strategy is built DISABLED with a visible
# reason in `/ui/rl_learner` — it never falls back to synthetic/zero/random weights.

[rl_predictor]
enabled = true
paper_only = true

# Universes where a BTC-5m bracket can land — all 3, same as the normal config
# (with `crypto-updown-long` assigned via model_btc5m, discovery claims all
# `*-updown-*` markets there by dedup alphabetical order and this strategy
# skipped every book → transitions_rx=0). The real scope is still BTC 5m:
# `is_target_market` filters slug and duration inside the strategy.
universe = ["crypto-updown-short", "crypto-updown-long", "g-rw1"]

# Rate/size: taker FOK per market, at most one intent in flight.
# Budget per entry (also capped by `initial_episode_budget`).
max_order_usdc = "5"
max_orders_per_hour = 120
daily_loss_usdc_stop = "10"

# APPROVED policy artifact: directory with `policy.json`+`manifest.json`
# (`status="paper_approved"`, `approval.scope="paper"`). Empty = disabled.
# paper_bootstrap_v1 = verified online tip (real update, drift 0).
artifact_dir = "src/tools/model/artifacts/rl_predictor/paper_bootstrap_v1"
# Online checkpoints of the learner (`<dir>/active.json` + `checkpoints/vNNNNNN/`).
# Dedicated, clean directory: the online chain starts with base_sha256 =
# sha256 of paper_bootstrap_v1's policy.json.
checkpoint_dir = "data/rl_predictor_bootstrap_v1"
# sha256 of the predictor (`model.json`) the policy was approved against —
# pinned explicitly: an artifact trained against another predictor does NOT load.
expected_predictor_sha256 = "ef4e4b0860ef9601fb21462539f4d43d2c8af378060eb2dcb63d153502e4c396"

# FIXED virtual budget per episode/market (USDC) — separates the sim's
# infinite paper money from learned ruin.
initial_episode_budget = "10"

# learning_enabled=false → frozen evaluation: deterministic argmax, no
# trainable experience. true → legal sampling + cohorts + gated updates.
learning_enabled = true

# Freshness of the prediction used as a feature (ms).
max_prediction_age_ms = 1500
# Entry window (seconds remaining); SELL never uses it.
min_remaining_secs = 30
max_remaining_secs = 240
# Maximum spread of the bought leg; slippage margin of the protective limit.
max_spread = "0.05"
slippage_margin = "0.01"
# Fee rate fallback if the book carries no `parabolic_fee_rate` (0.07 canonical).
fee_rate_fallback = "0.07"
# Minimum executable size (shares).
min_order_shares = "1"
# An intent without fill/reject in this time → uncertain market (does not
# invent a rejection; blocks new orders until reconciled or closed).
pending_timeout_ms = 3000
# Settlement polling on `positions` (real SQLite) after clear_at.
settle_poll_secs = 15
# Maximum wait for the official outcome before closing as `settle_timeout`.
settle_timeout_secs = 600

# Reward penalties (0 in v1).
lambda_inventory = 0.0
lambda_drawdown = 0.0
# Sampling PRNG seed (decision auditability).
rng_seed = 0

# Episodic REINFORCE learner (bounded worker; updates only when a complete
# cohort closes under a single policy version).
learner_capacity = 2048
learning_rate = 0.05
max_grad_norm = 1.0
# Numeric publication gates: update magnitude and KL over the cohort.
max_update_l2 = 0.5
max_mean_kl = 0.05
max_step_kl = 0.2
# Minimum complete episodes per cohort and accumulation cap (freeze).
min_episodes_per_update = 4
cohort_cap = 64
# Maximum wait at a cohort boundary before invalidating open episodes
# (SELLs of existing positions are never blocked by the boundary).
boundary_max_wait_ms = 360000
